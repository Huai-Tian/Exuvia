[package]
name = "eclosion"
version = "0.1.2"
edition = "2021"
license = "AGPL-3.0-only"
description = "羽化——Exuvia 脱壳功能的动态手段执行端(SKILL §9 六铁律;零策略纯执行引擎)"

# 独立二进制(SKILL §9 铁律 3:同仓、独立二进制、独立版本号)
[[bin]]
name = "exuvia-eclosion"
path = "src/main.rs"

[dependencies]
# 进程/内存/系统调用原语
libc = "0.2"

[profile.release]
strip = true
lto = true
