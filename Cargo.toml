[package]
name = "exuvia"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Deterministic Android unpacking pipeline for AI agents. Separate the shell from what lives inside."

# 依赖纪律：每个依赖对应一条已拍板的契约，无投机引入。
[dependencies]
# CLI 契约（README_AGENT §5）
clap = { version = "4", features = ["derive"] }
# 三条协议的机器事实源（serde 类型即格式；未知字段拒绝）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# fence 提取与解析（SKILL.md §7；语法错误 = installation-broken）
toml = "0.8"
# schema --dump 按需派生（视图，非静态 schema 文件）
schemars = "0.8"
zip = "9.0.5"
sha2 = "0.11.1"

[profile.release]
lto = true
strip = true
