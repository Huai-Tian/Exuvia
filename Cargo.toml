[package]
name = "exuvia"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Deterministic Android unpacking pipeline for AI agents. Separate the shell from what lives inside."

# ci/verify：私有语料对账工具（仓库内 CI 工具，不进发行物——§10 v0.1；比对逻辑公开、样本私有）
[workspace]
members = ["ci/verify", "eclosion"]

# 内存卫生（随羽化内嵌 E2EE-Experiment 4.1.0 落地）：snow 的 vendored fork——
# 上游 0.10.0 的会话密钥/链值/PSK/Kyber 私钥在 drop 后明文残留；fork 只加 zeroize，
# 行为逐位相同（delta 见 eclosion/vendor/e2ee/vendor/snow/Cargo.toml 头注释）。
# [patch] 只对 workspace 根生效（cargo 规则），故钉在这里而非 eclosion/vendor/e2ee/Cargo.toml。
[patch.crates-io]
snow = { path = "eclosion/vendor/e2ee/vendor/snow" }

# 依赖纪律：每个依赖对应一条已拍板的契约，无投机引入。
[dependencies]
# CLI 契约（README_AGENT §5）
clap = { version = "4", features = ["derive"] }
# 三条协议的机器事实源（serde 类型即格式；未知字段拒绝）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# fence 提取与解析（SKILL.md §7；语法错误 = installation-broken）
toml = "0.8"
# schema --dump 按需派生（视图，非静态 schema 文件）
schemars = "0.8"
zip = "9.0.5"
sha2 = "0.11.1"
libc = "0.2.191"
# hunt 判据链的 zlib 环节（L2 参数空间搜索器；rust_backend = miniz_oxide 纯 Rust，musl 静态友好）
flate2 = "1"
# hunt 的 aes-128-cbc-tail 容器谓词块原语（第二战挣得的族知识；纯 Rust，CBC 手工链接无填充库）
aes = "0.8"

[profile.release]
lto = true
strip = true
